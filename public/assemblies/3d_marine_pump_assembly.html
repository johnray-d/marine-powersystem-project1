<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Marine Pump CAD Twin...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const pump = (params.get('pump') || 'cooling').toLowerCase();
        const pumpMap = {
            fire: 'firePump',
            fire1: 'firePump',
            fire2: 'firePump',
            efire: 'firePump',
            cooling: 'coolingPump',
            cooling1: 'coolingPump',
            cooling2: 'coolingPump',
            ballast: 'ballastPump',
            bilge: 'bilgePump'
        };
        const eqId = pumpMap[pump] || 'coolingPump';
        window.location.replace('universal_viewer.html?eq=' + eqId);
    </script>
</head>
<body style="background:#0b111e; color:#94a3b8; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <div style="text-align:center;">
        <div style="width:28px; height:28px; border:3px solid #f97316; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px;"></div>
        <p style="font-size:13px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;">Loading Universal CAD Pump Twin...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
